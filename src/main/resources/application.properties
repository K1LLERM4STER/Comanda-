spring.application.name=comanda

# Arquivo opcional (NAO versionado) com a senha local. Veja application-local.properties.example
spring.config.import=optional:file:./application-local.properties

# --- PostgreSQL (podem ser sobrescritos por variaveis de ambiente) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comanda}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- Flyway: cria/atualiza o schema via src/main/resources/db/migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate: apenas VALIDA se as entidades batem com as tabelas ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
